[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcpgann"
version = "0.1.0"
description = "Reproducible IDC classification experiments with CNN ensembles and Cartesian-program ensemble optimization."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Eid Alkhaldi" }]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "Pillow>=9.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
notebooks = [
    "jupyterlab>=4.0.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
]

[project.scripts]
dcpgann-train = "train:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["train"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
